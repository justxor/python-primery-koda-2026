[project]
name = "python-primery-koda-2026"
version = "0.2.0"
description = "Примеры кода на Python 2026: лучшие практики и продвинутые темы"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# базовый набор: синтаксис, неиспользуемые импорты, неопределённые имена
select = ["E4", "E7", "E9", "F"]
